<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
    <style>
        body {
            background-color: #f0f0f0; /* Cor de fundo opcional */
            overflow-x: hidden; /* Evita barra de rolagem horizontal */
            min-height: 100vh;
        }

        /* Configuração do patinho */
        .patinho {
            position: fixed;       /* Fica sempre no rodapé da tela, mesmo rolando a página */
            bottom: 20px;          /* Distância do chão */
            left: -120px;
            width: 100px;          /* Tamanho do patinho */
            height: auto;
            z-index: 10;
            pointer-events: none;  /* Não atrapalha cliques nos campos e botões */

            /* Aplica a animação: nome, duração, ciclo infinito e velocidade constante */
            animation: andar 10s linear infinite;
        }

        /* Criando o movimento do patinho */
        @keyframes andar {
            0% {
                left: -120px; /* Começa antes de entrar na tela */
                transform: scaleX(1); /* Olhando para a direita */
            }
            49% {
                transform: scaleX(1); /* Continua olhando para a direita */
            }
            50% {
                left: calc(100% + 20px); /* Chega no final da tela e vira */
                transform: scaleX(-1); /* Inverte o patinho (olhando para a esquerda) */
            }
            99% {
                transform: scaleX(-1); /* Continua olhando para a esquerda */
            }
            100% {
                left: -120px; /* Volta para o início */
                transform: scaleX(1); /* Vira para a direita novamente */
            }
        }
    </style>
</head>
<body>
<div class="register-container">
    <div class="register-image-logo-container">
        <img th:src="@{/images/apc-login-bg.png}" alt="Logo PUC Minas">
    </div>

    <div class="register-form">
        <h2 class="register-title">Crie sua conta</h2>

        <form th:action="@{/register}" method="post">
            <input type="text" name="nome" placeholder="Nome completo" required>
            <input type="email" name="email" placeholder="E-mail" required>
            <input type="text" name="cpf" placeholder="CPF" required>
            <input type="text" name="rg" placeholder="RG" required>
            <input type="text" name="endereco" placeholder="Endereço" required>
            <input type="text" name="instituicao" placeholder="Instituição" required>
            <input type="password" name="senha" placeholder="Senha" required>

            <div class="register-button-container">
                <button type="submit">Registrar</button>
            </div>
        </form>

        <div class="register-redirect-options">
            Já possui conta? <a th:href="@{/login}">Faça login</a>
        </div>
    </div>
</div>

<!-- Patinho andando (SVG animado em static/images) -->
<img class="patinho" th:src="@{/images/patinho.svg}" alt="Patinho andando">
</body>
</html>

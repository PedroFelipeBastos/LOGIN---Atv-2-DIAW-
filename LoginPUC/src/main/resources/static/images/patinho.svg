<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110" width="120" height="110" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .perna { transform-box: fill-box; transform-origin: top center; }
    .p1 { animation: passo 0.4s ease-in-out infinite alternate; }
    .p2 { animation: passo 0.4s ease-in-out infinite alternate-reverse; }
    .corpo { animation: balanco 0.4s ease-in-out infinite alternate; }
    .asa { transform-box: fill-box; transform-origin: 20% 30%; animation: bater 0.8s ease-in-out infinite alternate; }
    @keyframes passo { from { transform: rotate(-25deg); } to { transform: rotate(25deg); } }
    @keyframes balanco { from { transform: translateY(0); } to { transform: translateY(-3px); } }
    @keyframes bater { from { transform: rotate(0deg); } to { transform: rotate(-12deg); } }
  </style>
  <!-- pernas -->
  <g class="perna p1">
    <rect x="50" y="80" width="4" height="18" fill="#F28C28"/>
    <path d="M44 98 h16 l-4 5 h-10 z" fill="#F28C28"/>
  </g>
  <g class="perna p2">
    <rect x="62" y="80" width="4" height="18" fill="#E07B1A"/>
    <path d="M56 98 h16 l-4 5 h-10 z" fill="#E07B1A"/>
  </g>
  <g class="corpo">
    <!-- cauda -->
    <path d="M18 58 L4 44 L24 50 Z" fill="#F7C600"/>
    <!-- corpo -->
    <ellipse cx="52" cy="62" rx="36" ry="24" fill="#FFD60A"/>
    <!-- asa -->
    <ellipse class="asa" cx="46" cy="60" rx="18" ry="11" fill="#F7C600"/>
    <!-- cabeça -->
    <circle cx="86" cy="34" r="18" fill="#FFD60A"/>
    <!-- bico -->
    <path d="M100 34 Q116 36 102 42 Z" fill="#F28C28"/>
    <!-- olho -->
    <circle cx="91" cy="29" r="3.5" fill="#222"/>
    <circle cx="92.2" cy="27.8" r="1.1" fill="#fff"/>
    <!-- bochecha -->
    <circle cx="84" cy="40" r="3" fill="#FFB3A7" opacity="0.7"/>
  </g>
</svg>

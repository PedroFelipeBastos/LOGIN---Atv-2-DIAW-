<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0; /* Cor de fundo opcional */
            overflow-x: hidden; /* Evita barra de rolagem horizontal */
            min-height: 100vh;
        }

        /* Configuração do patinho */
        .patinho {
            position: fixed;       /* Fica sempre no rodapé da tela, mesmo rolando a página */
            bottom: 20px;          /* Distância do chão */
            left: -120px;
            width: 100px;          /* Tamanho do patinho */
            height: auto;
            z-index: 10;
            pointer-events: none;  /* Não atrapalha cliques nos botões e links */

            /* Aplica a animação: nome, duração, ciclo infinito e velocidade constante */
            animation: andar 10s linear infinite;
        }

        /* Criando o movimento do patinho */
        @keyframes andar {
            0% {
                left: -120px; /* Começa antes de entrar na tela */
                transform: scaleX(1); /* Olhando para a direita */
            }
            49% {
                transform: scaleX(1); /* Continua olhando para a direita */
            }
            50% {
                left: calc(100% + 20px); /* Chega no final da tela e vira */
                transform: scaleX(-1); /* Inverte o patinho (olhando para a esquerda) */
            }
            99% {
                transform: scaleX(-1); /* Continua olhando para a esquerda */
            }
            100% {
                left: -120px; /* Volta para o início */
                transform: scaleX(1); /* Vira para a direita novamente */
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-image-logo-container">
            <img th:src="@{/images/apc-login-bg.png}" alt="logo PUC MINAS">
        </div>
        <div class="login-form">
            <form th:action="@{/login}" method="post" class="login-form">
                <h4 class="login-title">Login</h4>
                <input type="text" id="username" name="username" placeholder="username" required>
                <input type="password" id="password" name="password" placeholder="senha" required>
                <div class="login-button-container">
                    <button type="submit">Entrar</button>
                </div>
                <p class="login-redirect-options">
                    Ainda não tem cadastro? <br>
                    <a th:href="@{/register}">Cadastre-se</a>
                    <a th:href="@{/recoverpassword}">Esqueceu sua senha?</a>
                </p>
            </form>
        </div>
    </div>

    <!-- Patinho andando (SVG animado em static/images) -->
    <img class="patinho" th:src="@{/images/patinho.svg}" alt="Patinho andando">
</body>
</html>

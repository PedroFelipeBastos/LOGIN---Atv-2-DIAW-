<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>
<div class="register-container">
    <div class="register-image-logo-container">
        <img th:src="@{/images/logo-puc.png}" alt="PUC Minas">
    </div>

    <div class="register-form">
        <h2 class="register-title">Registro</h2>

        <form th:action="@{/register}" method="post">
            <div class="register-field">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div class="register-field">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="register-field">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" placeholder="999.999.999-99" maxlength="14"
                       pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Formato: 999.999.999-99" inputmode="numeric" required>
            </div>
            <div class="register-field">
                <label for="rg">RG</label>
                <input type="text" id="rg" name="rg" required>
            </div>
            <div class="register-field">
                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" name="endereco" required>
            </div>
            <div class="register-field">
                <label for="instituicao">Instituição de ensino</label>
                <select id="instituicao" name="instituicao" required>
                    <option value="" selected disabled>Selecione</option>
                    <option value="PUC Minas">PUC Minas</option>
                    <option value="UFMG">UFMG</option>
                    <option value="CEFET-MG">CEFET-MG</option>
                    <option value="UEMG">UEMG</option>
                    <option value="Outra">Outra</option>
                </select>
            </div>
            <div class="register-field">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>
            </div>

            <div class="register-button-container">
                <button type="submit">Registrar</button>
            </div>
        </form>

        <p class="register-redirect-options">
            Já tem uma conta? <a th:href="@{/login}">Faça login</a>
        </p>
    </div>
</div>

<img class="patinho" th:src="@{/images/patinho.svg}" alt="Patinho andando">

<script>
    document.getElementById("cpf").addEventListener("input", function (e) {
        const d = e.target.value.replace(/\D/g, "").slice(0, 11);
        e.target.value = d
            .replace(/^(\d{3})(\d)/, "$1.$2")
            .replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3")
            .replace(/\.(\d{3})(\d{1,2})$/, ".$1-$2");
    });
</script>
</body>
</html>

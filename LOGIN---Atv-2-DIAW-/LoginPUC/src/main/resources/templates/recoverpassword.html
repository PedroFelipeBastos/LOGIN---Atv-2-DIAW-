<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>
<div class="register-container">
    <div class="register-image-logo-container">
        <img th:src="@{/images/logo-puc.png}" alt="PUC Minas">
    </div>

    <div class="register-form">
        <h2 class="register-title">Recuperar senha</h2>

        <div class="register-message" th:if="${param.enviado}">
            Se o e-mail estiver cadastrado, você receberá as instruções para redefinir sua senha.
        </div>

        <p class="register-description" th:unless="${param.enviado}">
            Informe o e-mail cadastrado para receber as instruções de recuperação.
        </p>

        <form th:action="@{/recoverpassword}" method="post">
            <div class="register-field">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="register-button-container">
                <button type="submit">Enviar</button>
            </div>
        </form>

        <p class="register-redirect-options">
            Lembrou a senha? <a th:href="@{/login}">Faça login</a>
        </p>
    </div>
</div>

<img class="patinho" th:src="@{/images/patinho.svg}" alt="Patinho andando">
</body>
</html>
